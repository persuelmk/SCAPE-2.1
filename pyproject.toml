[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scape2"
version = "0.1.0.dev0"
description = "A reproducible Python implementation of SCAPE single-cell APA quantification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pysam>=0.22,<0.25",
]

[project.optional-dependencies]
speed = ["numba>=0.60,<0.68"]
test = ["pytest>=8,<10"]

[project.scripts]
scape2 = "scape2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
